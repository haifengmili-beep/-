<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:540px;height:960px;overflow:hidden;background:#000;font-family:"WenQuanYi Zen Hei",sans-serif}
#stage{position:absolute;inset:0}
#card{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:300px;background:#fff;border-radius:14px;
  box-shadow:0 4px 0 rgba(0,0,0,.06);text-align:center;padding:12px 0 12px;}
#card .a{color:#e0518a;font-size:22px;font-weight:bold;letter-spacing:1px}
#card .b{color:#f07aa5;font-size:26px;font-weight:bold;margin-top:6px;letter-spacing:2px}
.stroke{color:#fff;-webkit-text-stroke:7px #e0518a;paint-order:stroke fill;font-weight:bold}
#sub{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:31px;letter-spacing:1px}
#title{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:50px;line-height:76px;letter-spacing:2px}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:44px;line-height:70px;opacity:0}
#end .s{font-size:24px;-webkit-text-stroke:5px #e0518a;}
</style></head>
<body>
<div id="stage"></div>
<div id="card"><div class="a"></div><div class="b"></div></div>
<div id="title" class="stroke">假如猫成了主人<br>人类成了宠物</div>
<div id="end" class="stroke">陪伴<br>才是最长情的告白<br><span class="s">— 喵主人的一天 · 完 —</span></div>
<div id="sub" class="stroke"></div>
<div id="fade"></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const W=540,H=960;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(2);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,W/H,0.1,200);
const FONT='"WenQuanYi Zen Hei",sans-serif';

/* ---------- helpers ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=t=>t*t*(3-2*t);
const eseg=(t,a,b)=>ease(seg(t,a,b));
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;}}
const mats={};
function M(c){if(!mats[c])mats[c]=new THREE.MeshLambertMaterial({color:c});return mats[c];}
function MB(c,o=1){const k='b'+c+'_'+o;if(!mats[k])mats[k]=new THREE.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,depthWrite:o>=1});return mats[k];}
const boxGeo=new THREE.BoxGeometry(1,1,1);
function box(p,w,h,d,c,x=0,y=0,z=0,mat){const m=new THREE.Mesh(boxGeo,mat||M(c));m.scale.set(w,h,d);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
function pivot(p,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g;}
function canvasTex(w,h,draw,nearest){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;if(nearest){t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;}t.anisotropy=8;return t;}
function sprite(tex,sw,sh){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(sw,sh,1);return s;}
function textTex(txt,{color='#fff',stroke='#e0518a',px=150}={}){
  const w=Math.max(256,Math.ceil(txt.length*px*1.0+60)),h=Math.ceil(px*1.5);
  return canvasTex(w,h,(x)=>{x.font=`bold ${px}px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=px*0.16;x.strokeStyle=stroke;x.strokeText(txt,w/2,h/2+px*0.05);x.fillStyle=color;x.fillText(txt,w/2,h/2+px*0.05);});
}
function textSprite(txt,size=0.4,opt){const t=textTex(txt,opt);const a=t.image.width/t.image.height;return sprite(t,size*a,size);}
const HEART=["0110110","1111111","1111111","0111110","0011100","0001000"];
const heartTexCache={};
function heartTex(col){if(heartTexCache[col])return heartTexCache[col];return heartTexCache[col]=canvasTex(70,60,(x)=>{HEART.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='1'){x.fillStyle=col;x.fillRect(i*10,j*10,10,10);}}));x.fillStyle='rgba(255,255,255,.85)';x.fillRect(10,10,10,10);},true);}
function bubble(txt,size=0.42){
  const px=64,w=Math.ceil(txt.length*px+70),h=150;
  const t=canvasTex(w,h,(x)=>{x.fillStyle='#fff';x.strokeStyle='#e0518a';x.lineWidth=6;const r=26,bh=104;
    x.beginPath();x.moveTo(r+3,3);x.lineTo(w-r-3,3);x.quadraticCurveTo(w-3,3,w-3,r+3);x.lineTo(w-3,bh-r);x.quadraticCurveTo(w-3,bh,w-r-3,bh);
    x.lineTo(w*0.32,bh);x.lineTo(w*0.18,h-4);x.lineTo(w*0.2,bh);x.lineTo(r+3,bh);x.quadraticCurveTo(3,bh,3,bh-r);x.lineTo(3,r+3);x.quadraticCurveTo(3,3,r+3,3);x.closePath();x.fill();x.stroke();
    x.fillStyle='#d6407e';x.font=`bold ${px}px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,bh/2+3);});
  return sprite(t,size*w/h*1.0,size);
}
function addLights(s,{sky=0xffffff,ground=0xd8c8e8,hi=2.0,dc=0xffffff,di=2.4,pos=[-3,8,6],range=7}={}){
  const h=new THREE.HemisphereLight(sky,ground,hi);s.add(h);
  const d=new THREE.DirectionalLight(dc,di);d.position.set(...pos);d.castShadow=true;
  d.shadow.mapSize.set(2048,2048);const c=d.shadow.camera;c.left=-range;c.right=range;c.top=range;c.bottom=-range;c.near=0.5;c.far=40;
  d.shadow.bias=-0.0006;d.shadow.normalBias=0.02;d.shadow.radius=5;s.add(d);s.add(d.target);return {h,d};
}
/* hearts / particles that are pure functions of time */
function heartBurst(scene,n,seed,col){const r=rnd(seed),arr=[];for(let i=0;i<n;i++){const sp=sprite(heartTex(col||(i%3?'#ff6b9a':'#ff9cc0')),0.25,0.21);sp.visible=false;scene.add(sp);arr.push({sp,dx:(r()-.5)*1.4,dz:(r()-.5)*0.4,delay:r()*1.6,sz:0.18+r()*0.18,sw:r()*6});}
  return (t,origin,start)=>{for(const p of arr){const lt=t-start-p.delay;if(lt<0||lt>1.8){p.sp.visible=false;continue;}p.sp.visible=true;const k=lt/1.8;
    p.sp.position.set(origin.x+p.dx*k+Math.sin(lt*4+p.sw)*0.08,origin.y+k*1.3,origin.z+p.dz);const s=p.sz*(k<0.15?k/0.15:1);p.sp.scale.set(s*1.17,s,1);p.sp.material.opacity=k>0.7?(1-k)/0.3:1;}};}

/* ---------- characters ---------- */
function makeCat(o){
  const fur=o.fur,pt=o.points||fur,top=o.top||fur;
  const root=new THREE.Group(),g={root,eyes:[]};
  const body=pivot(root);g.body=body;
  for(const s of[-1,1]){const leg=pivot(body,s*0.15,0.42,0);box(leg,0.22,0.42,0.26,o.pants||fur,0,-0.21,0);box(leg,0.24,0.08,0.3,pt,0,-0.38,0.03);g[s<0?'legR':'legL']=leg;}
  const torso=pivot(body,0,0.42,0);g.torso=torso;
  box(torso,0.62,0.62,0.42,top,0,0.31,0);
  if(o.belly)box(torso,0.36,0.36,0.02,o.belly,0,0.24,0.215);
  if(o.decor)o.decor(torso);
  for(const s of[-1,1]){const arm=pivot(torso,s*0.4,0.56,0);box(arm,0.18,0.42,0.22,o.sleeve||top,0,-0.17,0);box(arm,0.19,0.13,0.23,pt,0,-0.44,0);g[s<0?'armR':'armL']=arm;}
  const tail=pivot(body,0,0.55,-0.2);box(tail,0.13,0.62,0.13,o.tail||pt,0,0.29,0);tail.rotation.x=-0.7;g.tail=tail;
  if(o.stripes)for(const y of[0.15,0.45])box(tail,0.14,0.08,0.14,o.stripes,0,y,0);
  const head=pivot(torso,0,0.62,0);g.head=head;
  box(head,0.86,0.7,0.7,fur,0,0.35,0);
  const F=0.351;
  if(o.mask){box(head,0.5,0.34,0.02,pt,0,0.3,F);}
  if(o.stripes){for(const x of[-0.13,0,0.13])box(head,0.07,0.15,0.02,o.stripes,x,0.6,F);for(const s of[-1,1]){box(head,0.02,0.05,0.22,o.stripes,s*0.431,0.42,0.05);box(head,0.02,0.05,0.22,o.stripes,s*0.431,0.3,0.05);}}
  for(const s of[-1,1]){const ear=pivot(head,s*0.27,0.7,0);box(ear,0.24,0.3,0.14,o.ear||pt,0,0.13,0);box(ear,0.12,0.17,0.02,0xffb3c6,0,0.11,0.075);ear.rotation.z=-s*0.14;g[s<0?'earR':'earL']=ear;}
  for(const s of[-1,1]){
    if(o.glasses){box(head,0.25,0.25,0.015,0xd4a017,s*0.19,0.41,F+0.003);box(head,0.2,0.2,0.016,0xfff8e7,s*0.19,0.41,F+0.006);}
    const e=pivot(head,s*0.19,0.41,F+0.01);box(e,0.15,0.18,0.02,o.eye||0x1c1c24,0,0,0);box(e,0.06,0.06,0.02,0xffffff,-0.03,0.04,0.006);box(e,0.03,0.03,0.02,0xffffff,0.035,-0.045,0.006);g.eyes.push(e);
    box(head,0.13,0.05,0.02,0xff9fb2,s*0.31,0.25,F);
    box(head,0.18,0.014,0.01,0x9a8a80,s*0.5,0.26,0.2);box(head,0.18,0.014,0.01,0x9a8a80,s*0.5,0.21,0.2);
  }
  if(o.glasses)box(head,0.14,0.03,0.016,0xd4a017,0,0.43,F+0.003);
  box(head,0.1,0.06,0.02,0xf2788f,0,0.27,F);
  const mouth=box(head,0.14,0.05,0.02,0xf6c3a8,0,0.2,F);g.mouth=mouth;
  root.scale.setScalar(o.scale||1);
  return g;
}
const SKIN=0xf6d2b4;
function makeHuman(o){
  const root=new THREE.Group(),g={root,eyes:[]};
  const hips=pivot(root,0,0.5,0);g.hips=hips;
  for(const s of[-1,1]){const leg=pivot(hips,s*0.12,0,0);box(leg,0.2,0.5,0.22,o.pants,0,-0.25,0);box(leg,0.21,0.09,0.28,o.shoes||0x4a4a5a,0,-0.46,0.03);g[s<0?'legR':'legL']=leg;}
  const torso=pivot(hips);g.torso=torso;box(torso,0.5,0.56,0.28,o.shirt,0,0.28,0);
  if(o.decor)o.decor(torso);
  for(const s of[-1,1]){const arm=pivot(torso,s*0.335,0.52,0);box(arm,0.17,0.2,0.2,o.shirt,0,-0.08,0);box(arm,0.15,0.3,0.17,SKIN,0,-0.32,0);g[s<0?'armR':'armL']=arm;}
  box(torso,0.32,0.08,0.31,0xe63956,0,0.6,0);
  const bell=new THREE.Mesh(new THREE.SphereGeometry(0.055,12,10),M(0xffc93c));bell.position.set(0,0.53,0.175);bell.castShadow=true;torso.add(bell);
  const head=pivot(torso,0,0.62,0);g.head=head;
  box(head,0.46,0.46,0.42,SKIN,0,0.23,0);
  const hc=o.hair;
  box(head,0.5,0.13,0.46,hc,0,0.47,0);box(head,0.5,o.long?0.62:0.34,0.1,hc,0,o.long?0.18:0.32,-0.19);
  box(head,0.5,0.1,0.06,hc,0,0.4,0.2);
  for(const s of[-1,1])box(head,0.06,o.long?0.55:0.26,0.38,hc,s*0.24,o.long?0.18:0.34,-0.02);
  const F=0.212;
  for(const s of[-1,1]){const e=pivot(head,s*0.1,0.22,F);box(e,0.075,0.1,0.02,0x1c1c24);box(e,0.03,0.03,0.02,0xffffff,-0.015,0.025,0.006);g.eyes.push(e);
    box(head,0.08,0.03,0.02,0xff9fb2,s*0.165,0.14,F-0.002);}
  g.mouth=box(head,0.07,0.025,0.02,0xc8505f,0,0.1,F);
  root.scale.setScalar(o.scale||0.82);
  return g;
}
function pose0(g){for(const k of['legL','legR','armL','armR','head','torso','hips'])if(g[k]){g[k].rotation.set(0,0,0);}if(g.tail)g.tail.rotation.set(-0.7,0,0);}
function walk(g,ph,a=0.6){g.legL.rotation.x=Math.sin(ph)*a;g.legR.rotation.x=-Math.sin(ph)*a;g.armL.rotation.x=-Math.sin(ph)*a*0.8;g.armR.rotation.x=Math.sin(ph)*a*0.8;}
function eyes(g,sy,sx=1){for(const e of g.eyes)e.scale.set(sx,sy,1);}

/* ---------- reusable props ---------- */
function windowOn(p,x,y,z,w,h,pane=0xbfe3f5){const g=pivot(p,x,y,z);box(g,w+0.16,h+0.16,0.08,0xffffff);const pw=(w-0.06)/2,ph=(h-0.06)/2;
  for(const i of[-1,1])for(const j of[-1,1])box(g,pw,ph,0.02,pane,i*(pw/2+0.03),j*(ph/2+0.03),0.05,MB(pane));box(g,w+0.3,0.08,0.18,0xffffff,0,-h/2-0.1,0.06);return g;}
function plank(p,x0,x1,z0,z1,c){for(let z=z0;z<=z1;z+=0.7)box(p,x1-x0,0.005,0.025,c,(x0+x1)/2,0.002,z);}

/* ================= SCENES ================= */
const SC=[];

/* 1. Bedroom: wake up */
SC.push((()=>{
  const s=new THREE.Scene();s.background=new THREE.Color(0xe4d2f0);
  addLights(s,{sky:0xfff6ea,ground:0xd9c5ea,hi:2.1,dc:0xfff0d6,di:2.6,pos:[-4,7,5]});
  box(s,16,0.2,12,0xeec497,0,-0.1,0);plank(s,-8,8,-5,5,0xdcae7f);
  box(s,16,9,0.2,0xdcc6ee,0,4.4,-2.3);
  windowOn(s,-1.25,2.7,-2.18,1.3,1.5);
  const sun=sprite(canvasTex(128,128,(x)=>{const g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(255,240,180,1)');g.addColorStop(.35,'rgba(255,230,150,.8)');g.addColorStop(1,'rgba(255,230,150,0)');x.fillStyle=g;x.fillRect(0,0,128,128);}),1.2,1.2);sun.position.set(-0.95,3.0,-2.12);s.add(sun);
  for(const i of[0,1,2]){const b=new THREE.Mesh(new THREE.PlaneGeometry(0.35,4.2),MB(0xfff2b8,0.16));b.position.set(-0.85+i*0.45,1.7,-1.1);b.rotation.set(-0.6,0,0.35);s.add(b);}
  // picture of a fish
  const pic=pivot(s,1.3,3.0,-2.18);box(pic,0.9,0.7,0.06,0xffffff);const ft=canvasTex(90,70,(x)=>{x.fillStyle='#ffe9a8';x.fillRect(0,0,90,70);x.fillStyle='#5aa9e6';x.fillRect(20,28,40,16);x.fillRect(60,22,12,28);x.fillRect(28,22,24,6);x.fillStyle='#222';x.fillRect(26,31,5,5);},true);
  const fp=new THREE.Mesh(new THREE.PlaneGeometry(0.76,0.56),new THREE.MeshBasicMaterial({map:ft}));fp.position.z=0.035;pic.add(fp);
  box(s,3.2,0.02,2.2,0xf7b7cf,0.2,0.01,0.6);
  // bed (along z)
  const bed=pivot(s,0.45,0,-0.65);
  box(bed,1.35,0.4,2.3,0xc48a5c,0,0.2,0);box(bed,1.3,0.22,2.2,0xffffff,0,0.51,0);box(bed,1.45,1.2,0.14,0xc48a5c,0,0.6,-1.17);
  box(bed,0.9,0.16,0.42,0xfff3f8,0,0.69,-0.85);
  const blanket=box(bed,1.38,0.14,1.25,0xff9cbe,0,0.69,0.47);box(bed,1.39,0.142,0.12,0xffffff,0,0.69,-0.1);
  // nightstand
  box(s,0.6,0.6,0.5,0xd9a273,1.65,0.3,-1.6);box(s,0.2,0.08,0.2,0xfff,1.65,0.64,-1.6);
  const clock=pivot(s,1.65,0.8,-1.6);box(clock,0.32,0.32,0.14,0xff8fab);box(clock,0.24,0.24,0.02,0xffffff,0,0,0.075);box(clock,0.02,0.09,0.02,0x333,0,0.04,0.09);box(clock,0.07,0.02,0.02,0x333,0.03,0,0.09);
  // human
  const hu=makeHuman({shirt:0x8ecae6,pants:0x6c8fd1,hair:0x4a3528});
  hu.root.position.set(0.45,0.25,-0.6);s.add(hu.root);
  // cat owner: orange tabby in silk robe
  const robe=(t)=>{box(t,0.08,0.6,0.02,0xe9cfa0,-0.08,0.33,0.215);box(t,0.08,0.6,0.02,0xe9cfa0,0.08,0.33,0.215);box(t,0.64,0.07,0.44,0xd9a86c,0,0.2,0);box(t,0.18,0.25,0.02,0xff9a3c,0,0.44,0.214);};
  const cat=makeCat({fur:0xf6a54a,points:0xf6a54a,stripes:0xd77a2a,top:0xf7e3bd,sleeve:0xf7e3bd,belly:null,decor:robe});
  cat.root.position.set(-0.85,0,-0.45);s.add(cat.root);
  const zz=[0,1,2].map(i=>{const z=textSprite(i?'z':'Z',0.3,{color:'#8aa6ff',stroke:'#ffffff',px:120});s.add(z);return z;});
  const bang=textSprite('!',0.5,{color:'#ffcf3c',stroke:'#e0518a'});s.add(bang);
  const hb=heartBurst(s,10,7);
  const bub=bubble('起床啦，铲屎人~',0.42);s.add(bub);
  return {s,update(t){
    pose0(cat);pose0(hu);
    // human: lying -> sit up
    const up=eseg(t,3.0,3.7);
    hu.hips.rotation.x=-Math.PI/2*(1-up);
    hu.legL.rotation.x=hu.legR.rotation.x=-Math.PI/2*up;
    hu.root.position.y=0.25+0.0*up;
    hu.head.rotation.z=(1-up)*0.25;
    eyes(hu,t<3.0?0.15:(t<3.3?1.3:1));
    if(up>0.9){hu.armL.rotation.z=0.3;hu.armR.rotation.x=-2.6+Math.sin(t*9)*0.25;hu.armR.rotation.z=-0.2;}
    blanket.position.y=0.69;
    // cat pats
    cat.root.rotation.y=0.95;
    cat.torso.rotation.x=0.18;
    const pat=t<3.0?Math.abs(Math.sin(t*7)):0;
    cat.armL.rotation.x=t<3.0?-1.5-pat*0.35:-0.2;cat.armL.rotation.z=0.2;
    cat.head.rotation.z=Math.sin(t*2)*0.06;cat.tail.rotation.z=Math.sin(t*3)*0.35;
    if(t>3.3){cat.torso.rotation.x=0;eyes(cat,0.35);cat.armR.rotation.z=-0.4-Math.abs(Math.sin(t*6))*0.3;}else eyes(cat,1);
    zz.forEach((z,i)=>{const k=((t*0.8+i/3)%1);z.visible=t<3.0;z.position.set(0.2+k*0.45,1.25+k*0.9,-1.25);z.material.opacity=1-k;});
    bang.visible=t>3.05&&t<4.2;bang.position.set(0.7,1.8,-0.6);const bs=0.5*(1+0.2*Math.sin(t*20)*(t<3.4?1:0));bang.scale.set(bs*0.6,bs,1);
    bub.visible=t>2.0&&t<3.0;bub.position.set(-0.3,2.45,-0.3);
    hb(t,new THREE.Vector3(0.1,1.6,-0.3),3.6);
    const k=eseg(t,0,5);camera.position.set(lerp(2.2,1.6,k),lerp(3.6,3.0,k),lerp(7.2,6.0,k));camera.lookAt(0.05,0.95,-0.6);
  }};
})());

/* 2. Kitchen: feeding time */
SC.push((()=>{
