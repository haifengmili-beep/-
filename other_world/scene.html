  for (const x of [80, 336]) { g.fillStyle = '#6fb7ff'; g.beginPath(); g.ellipse(x, 64, 40, 20, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(x + 34, 64); g.lineTo(x + 62, 44); g.lineTo(x + 62, 84); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 20, 58, 5, 0, 7); g.fill(); }
  g.fillStyle = '#e8627f'; g.font = 'bold 44px "WenQuanYi Zen Hei"'; g.fillText('鱼罐头', 160, 80); g.fillText('鱼罐头', 416 - 256 + 256 + 0, 80);
});
const canMats = [std(0xffffff, { map: canTex, roughness: 0.45 }), std(0xdfe3ea, { metalness: 0.6, roughness: 0.3 }), std(0xdfe3ea, { metalness: 0.6, roughness: 0.3 })];
const canGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.5, 28);
const cans = [];
{ let k = 0; for (let row = 0; row < 5; row++) { const n = 5 - row; for (let i = 0; i < n; i++) for (let j = 0; j < Math.max(1, 3 - Math.floor(row / 2)); j++) {
  const c = new THREE.Mesh(canGeo, canMats); c.position.set(CANS.x - 1.0 + (i - (n - 1) / 2) * 0.88, 0.25 + row * 0.5, CANS.z - 1.6 - j * 0.88 + row * 0.25);
  c.rotation.y = (k++ * 1.7) % 6.28; c.castShadow = true; c.receiveShadow = true; scene.add(c); cans.push(c); } } }
// one open can next to the cat
const openCan = new THREE.Mesh(canGeo, canMats); openCan.position.set(CANS.x + 1.6, 0.25, CANS.z + 0.6); openCan.castShadow = true; scene.add(openCan);
const fish = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.06, 28), std(0xffa78a)); fish.position.set(CANS.x + 1.6, 0.48, CANS.z + 0.6); scene.add(fish);

// ---------------------------------------------------------------- memory polaroids
function polaroid(kind) {
  return canvasTex(300, 360, (g, w, h) => {
    g.fillStyle = '#fffdf8'; g.fillRect(0, 0, w, h);
    const bg = { box: '#ffe1b0', hand: '#cfe6ff', lap: '#e7d7ff', yarn: '#d4f2d8' }[kind];
    g.fillStyle = bg; g.fillRect(18, 18, w - 36, 250);
    const kitty = (x, y, s, happy) => { g.fillStyle = '#f8c5d6'; g.fillRect(x - 50 * s, y - 36 * s, 100 * s, 72 * s);
      g.fillStyle = '#ee88a8'; g.beginPath(); g.moveTo(x - 44 * s, y - 36 * s); g.lineTo(x - 28 * s, y - 66 * s); g.lineTo(x - 12 * s, y - 36 * s); g.fill();
      g.beginPath(); g.moveTo(x + 44 * s, y - 36 * s); g.lineTo(x + 28 * s, y - 66 * s); g.lineTo(x + 12 * s, y - 36 * s); g.fill();
      g.fillStyle = '#141414';
      if (happy) { g.strokeStyle = '#141414'; g.lineWidth = 5 * s; for (const ex of [-22, 22]) { g.beginPath(); g.arc(x + ex * s, y, 10 * s, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); } }
      else { g.fillRect(x - 32 * s, y - 14 * s, 20 * s, 22 * s); g.fillRect(x + 12 * s, y - 14 * s, 20 * s, 22 * s); }
      g.fillStyle = '#f27ba0'; g.fillRect(x - 44 * s, y + 14 * s, 14 * s, 7 * s); g.fillRect(x + 30 * s, y + 14 * s, 14 * s, 7 * s); };
    if (kind === 'box') { g.fillStyle = '#c99566'; g.fillRect(70, 170, 160, 90); kitty(150, 150, 0.8, false); g.fillStyle = '#b3804f'; g.fillRect(70, 170, 160, 18); }
    if (kind === 'hand') { kitty(130, 160, 1, true); g.fillStyle = '#f7d8c4'; g.beginPath(); g.ellipse(210, 100, 48, 28, -0.5, 0, 7); g.fill(); }
    if (kind === 'lap') { g.fillStyle = '#7cb892'; g.fillRect(18, 200, w - 36, 68); kitty(150, 180, 0.95, true); g.fillStyle = '#666'; g.font = 'bold 30px sans-serif'; g.fillText('z z', 200, 90); }
    if (kind === 'yarn') { kitty(110, 170, 0.8, false); g.fillStyle = '#8fc6ff'; g.beginPath(); g.arc(215, 200, 34, 0, 7); g.fill(); g.strokeStyle = '#5a9be0'; g.lineWidth = 4; g.beginPath(); g.arc(215, 200, 22, 0.5, 3); g.stroke(); }
    g.fillStyle = '#e8627f'; g.font = '30px "WenQuanYi Zen Hei"';
    g.fillText({ box: '第一天回家', hand: '最爱摸摸头', lap: '你的腿上', yarn: '我的毛线球' }[kind], 40, 322);
  });
}
const memories = new THREE.Group(); scene.add(memories);
['box', 'hand', 'lap', 'yarn', 'box', 'hand'].forEach((k, i) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.9), new THREE.MeshStandardMaterial({ map: polaroid(k), side: THREE.DoubleSide, emissive: 0xffffff, emissiveMap: null, emissiveIntensity: 0.12 }));
  memories.add(m);
});
const memGlow = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 3), new THREE.MeshBasicMaterial({ color: 0xfff1b8 })); scene.add(memGlow);

// ---------------------------------------------------------------- hearts
const hs = new THREE.Shape(); hs.moveTo(0, -0.5); hs.bezierCurveTo(-0.15, -0.3, -0.6, -0.1, -0.5, 0.2); hs.bezierCurveTo(-0.4, 0.5, -0.05, 0.5, 0, 0.25); hs.bezierCurveTo(0.05, 0.5, 0.4, 0.5, 0.5, 0.2); hs.bezierCurveTo(0.6, -0.1, 0.15, -0.3, 0, -0.5);
const heartGeo = new THREE.ExtrudeGeometry(hs, { depth: 0.18, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 3, curveSegments: 16 }); heartGeo.center();
const hearts = []; { const r = rng(41); for (let i = 0; i < 14; i++) { const h = new THREE.Mesh(heartGeo, std(0xff7fa6, { emissive: 0xff5d8f, emissiveIntensity: 0.5, roughness: 0.4 }));
  h.userData = { x: r() * 5 - 2.5, z: -0.6 - r() * 1.4, d: r() * 2.5, s: 0.25 + r() * 0.3, w: r() * 6 }; scene.add(h); hearts.push(h); } }

// ---------------------------------------------------------------- timeline
const S = { room: [0, 4.6], hello: [4.6, 9.6], sun: [9.6, 14.2], cans: [14.2, 18.2], down: [18.2, 20.9], mem: [20.9, 24.2], bridge: [24.2, 30] };
const inS = (t, k) => t >= S[k][0] && t < S[k][1];
const loc = (t, k) => t - S[k][0];

function catState(t) {
  const s = { pos: V(0, 0, 0), rotY: 0, hop: 0, wave: 0, happy: false, lie: 0, walk: 0, headPitch: 0, headYaw: 0, headRoll: 0, tailSpeed: 2, flap: 1, squash: 0, spin: 0 };
  if (inS(t, 'room')) { s.pos = V(0, 500, 0); return s; }
  if (inS(t, 'hello')) { const u = loc(t, 'hello');
    s.wave = kf(u, [[0.6, 0], [1.0, 1], [2.6, 1], [3.0, 0]]); s.happy = u > 2.9 && u < 4.6; s.headRoll = kf(u, [[2.8, 0], [3.2, 0.18], [4.6, 0.18], [5, 0]]);
    s.hop = Math.max(0, Math.sin(clamp((u - 0.2) / 0.5) * Math.PI)) * 0.35; s.tailSpeed = 3; return s; }
  if (inS(t, 'sun')) { const u = loc(t, 'sun');
    s.pos = SUNSPOT.clone().add(V(0, 0.27, 0)); s.rotY = 0.5; s.lie = 1; s.happy = true; s.headRoll = 0.25 + Math.sin(u * 1.2) * 0.08; s.tailSpeed = 1.2; s.flap = 0.2;
    s.headPitch = 0.1; return s; }
  if (inS(t, 'cans')) { const u = loc(t, 'cans');
    s.pos = CANS.clone().add(V(0.6, 0, 1.0)); s.rotY = 0.3;
    const j1 = clamp((u - 0.3) / 0.55), j2 = clamp((u - 2.2) / 0.9);
    s.hop = Math.sin(j1 * Math.PI) * 0.5 + Math.sin(j2 * Math.PI) * 1.4;
    s.spin = smooth(j2) * Math.PI * 2; s.squash = (u > 0.85 && u < 1.05 ? 0.4 : 0) + (u > 3.1 && u < 3.35 ? 0.5 : 0);
    s.happy = u > 1.0; s.tailSpeed = 6; s.flap = 2; return s; }
  if (inS(t, 'down')) { const u = loc(t, 'down');
    s.pos = V(0, 0, 7.0); s.rotY = 0; s.headPitch = 0.55; s.headRoll = 0.1; s.tailSpeed = 1; s.flap = 0.3; return s; }
  if (inS(t, 'mem')) { const u = loc(t, 'mem');
    s.pos = V(0, 0, 0); s.rotY = 0; s.happy = u > 1.6; s.headPitch = -0.12; s.headYaw = Math.sin(u * 1.4) * 0.25; s.tailSpeed = 2; return s; }
  { const u = loc(t, 'bridge');
    const z = kf(u, [[0, -2], [2.4, -9.5]]);
    s.pos = V(Math.sin(z * 0.35) * 0.4, -0.05 * Math.max(0, (-z - 4.5) / 2.6), z);
    s.walk = u < 2.4 ? 1 : 0; s.hop = s.walk * Math.abs(Math.sin(u * 10)) * 0.08;
    s.rotY = kf(u, [[0, Math.PI], [2.5, Math.PI], [3.2, 0]]);
    s.wave = kf(u, [[3.1, 0], [3.4, 1], [5.6, 1]]); s.happy = u > 3.2; s.headRoll = u > 3.2 ? 0.15 : 0; s.tailSpeed = 3;
    return s; }
}

function cameraAt(t) {
  if (inS(t, 'room')) { const u = loc(t, 'room');
    return { p: kf(u, [[0, V(1.5, 2.7, 7.5)], [4.6, V(0.6, 1.9, 4.6)]]).add(ROOM), l: kf(u, [[0, V(0, 1.0, 0)], [4.6, V(0.4, 1.4, -0.6)]]).add(ROOM), fov: 48 }; }
  if (inS(t, 'hello')) { const u = loc(t, 'hello');
    return { p: kf(u, [[0, V(0.8, 3.2, 10)], [5, V(-0.3, 1.9, 5.2)]]), l: V(0, 1.3, 0), fov: 46 }; }
  if (inS(t, 'sun')) { const u = loc(t, 'sun'); const a = 0.7 + u * 0.08;
    return { p: SUNSPOT.clone().add(V(Math.sin(a) * 5, 2.3 - u * 0.12, Math.cos(a) * 5)), l: SUNSPOT.clone().add(V(0, 0.9, 0)), fov: 46 }; }
  if (inS(t, 'cans')) { const u = loc(t, 'cans');
    return { p: CANS.clone().add(kf(u, [[0, V(3.4, 1.6, 8.4)], [4, V(2.6, 1.3, 7.2)]])), l: CANS.clone().add(V(-0.1, 1.6, 0)), fov: 50 }; }
  if (inS(t, 'down')) { const u = loc(t, 'down');
    return { p: kf(u, [[0, V(-2.6, 3.4, 2.6)], [0.9, V(1.6, 3.6, 10.4)], [2.0, V(0, -46, 12.5)], [2.7, V(0.3, -53.5, 16.5)]]),
             l: kf(u, [[0, V(0.3, 0.7, 8.6)], [0.9, V(0, -6, 11)], [2.0, V(0, -60, 11)], [2.7, V(0.3, -59.2, 11.3)]]), fov: 48 }; }
  if (inS(t, 'mem')) { const u = loc(t, 'mem'); const a = -0.5 + u * 0.22;
    return { p: V(Math.sin(a) * 6.6, 2.4 + u * 0.05, Math.cos(a) * 6.6), l: V(0, 1.4, 0), fov: 48 }; }
  { const u = loc(t, 'bridge'); const cz = catState(t).pos.z;
    return { p: kf(u, [[0, V(0.8, 3.4, 4.5)], [2.4, V(0.5, 3.0, -2.6)], [3.0, V(0.2, 2.2, -3.4)], [6, V(0, 2.0, -4.2)]]),
             l: kf(u, [[0, V(0, 1.2, -12)], [2.4, V(0, 1.2, -14)], [3.0, V(0, 1.3, cz)], [6, V(0, 2.3, cz)]]), fov: 48 }; }
}

// ---------------------------------------------------------------- 2D overlay (subtitles/titles)
const out = document.createElement('canvas'); out.width = W; out.height = H; const ox = out.getContext('2d');
const FONT = '"WenQuanYi Zen Hei", sans-serif';
function textBlock(str, y, size, alpha, color = '#fff', glow = 'rgba(120,60,110,0.55)') {
  if (alpha <= 0) return;
  ox.save(); ox.globalAlpha = alpha; ox.font = `${Math.round(size * SCALE)}px ${FONT}`; ox.textAlign = 'center'; ox.textBaseline = 'middle';
  ox.shadowColor = glow; ox.shadowBlur = 18 * SCALE; ox.lineJoin = 'round';
  ox.strokeStyle = 'rgba(110,50,100,0.55)'; ox.lineWidth = size * 0.14 * SCALE; ox.strokeText(str, W / 2, y * SCALE);
  ox.shadowBlur = 0; ox.fillStyle = color; ox.fillText(str, W / 2, y * SCALE); ox.restore();
}
function wrap(str, max = 13) { // split at punctuation into lines of <= max chars
  const parts = str.split(/(?<=[，。！？])/); const lines = []; let cur = '';
  for (const p of parts) { if ((cur + p).length > max && cur) { lines.push(cur); cur = p; } else cur += p; }
  if (cur) lines.push(cur); return lines.map(l => l.replace(/[，。]$/, ''));
}
function overlay(t) {
  ox.clearRect(0, 0, W, H); ox.drawImage(renderer.domElement, 0, 0);
  // vignette
  const vg = ox.createRadialGradient(W / 2, H * 0.48, H * 0.3, W / 2, H * 0.5, H * 0.75);
  vg.addColorStop(0, 'rgba(60,20,60,0)'); vg.addColorStop(1, 'rgba(60,20,60,0.32)'); ox.fillStyle = vg; ox.fillRect(0, 0, W, H);
  // title
  const ta = smooth((t - 0.3) / 0.8) * (1 - smooth((t - 3.9) / 0.5));
  textBlock('假如你的猫', 560, 96, ta); textBlock('已在另一个世界', 690, 96, ta);
  textBlock('它会对你说……', 860, 64, smooth((t - 1.4) / 0.7) * (1 - smooth((t - 3.9) / 0.5)), '#ffe3ee');
  // subtitles
  for (const L of LINES) {
    const a = smooth((t - L.start + 0.1) / 0.25) * (1 - smooth((t - L.end - 0.15) / 0.25));
    if (a <= 0) continue;
    const ls = wrap(L.sub || L.text); ls.forEach((s, i) => textBlock(s, 1480 + (i - (ls.length - 1) / 2) * 92, 70, a));
  }
  // ending card
  const ea = smooth((t - 28.0) / 0.8);
  textBlock('它没有离开', 330, 84, ea, '#fff'); textBlock('只是换了个地方，继续爱你', 450, 64, smooth((t - 28.5) / 0.8), '#ffe3ee');
  // dip-to-white transitions
  let wa = 0;
  for (const [tc, d] of [[4.6, 0.45], [9.6, 0.3], [14.2, 0.3], [18.2, 0.3], [20.9, 0.35], [24.2, 0.35]]) wa = Math.max(wa, 1 - clamp(Math.abs(t - tc) / d));
  wa = Math.max(wa, 1 - smooth(t / 0.4));
  if (wa > 0) { ox.fillStyle = t < 0.5 ? `rgba(30,10,30,${wa})` : `rgba(255,248,252,${smooth(wa)})`; ox.fillRect(0, 0, W, H); }
  // gentle end fade
  const fe = smooth((t - 29.4) / 0.6); if (fe > 0) { ox.fillStyle = `rgba(255,248,252,${fe * 0.9})`; ox.fillRect(0, 0, W, H); }
}

// ---------------------------------------------------------------- per-frame update
function update(t) {
  const s = catState(t); poseCat(s, t);
  const c = cameraAt(t); camera.position.copy(c.p); camera.lookAt(c.l); camera.fov = c.fov; camera.updateProjectionMatrix();
  // sun & shadow follow the active spot
  const focus = s.pos.y > 100 ? V(0, 0, 0) : s.pos;
  sun.position.copy(focus).add(V(8, 18, 10)); sun.target.position.copy(focus); sun.target.updateMatrixWorld();
  // sparkles drift
  const pa = spGeo.attributes.position.array;
  spBase.forEach((b, i) => { pa[i * 3] = b[0] + Math.sin(t * 0.3 + b[3]) * 0.6; pa[i * 3 + 1] = b[1] + ((t * 0.25 + b[3]) % 3); pa[i * 3 + 2] = b[2]; });
  spGeo.attributes.position.needsUpdate = true;
  // room scene: hide the sky stuff while inside the room
  const inRoom = inS(t, 'room') || (inS(t, 'down') && loc(t, 'down') > 1.4);
  sky.material.uniforms.top.value.set(inRoom ? 0x2c2440 : 0xb9c8f5);
  sky.material.uniforms.mid.value.set(inRoom ? 0x4a3550 : 0xf7d3ea);
  sky.material.uniforms.bot.value.set(inRoom ? 0x2a1f30 : 0xffe6cf);
  scene.fog.far = inRoom ? 2000 : 140; scene.fog.near = inRoom ? 1000 : 30;
  hemi.intensity = inRoom ? 0.55 : 1.25; sun.intensity = inRoom ? 0 : 2.4;
  rays.children.forEach((r, i) => r.material.opacity = 0.16 + Math.sin(t * 1.5 + i) * 0.05);
  // person breathing
  room.userData.person.position.y = Math.sin(t * 1.6) * 0.01;
  // memories orbit (only in memory scene)
  const mu = loc(t, 'mem'); const memOn = inS(t, 'mem');
  memories.visible = memOn; memGlow.visible = memOn;
  memories.children.forEach((m, i) => { const a = i / 6 * Math.PI * 2 + mu * 0.6; const r = 2.5 * smooth(mu / 1.2) + 0.2;
    m.position.set(Math.sin(a) * r, 2.5 + Math.sin(a * 2 + mu) * 0.3 + (1 - smooth(mu / 1.2)) * 0.5, Math.cos(a) * r);
    m.lookAt(camera.position); m.scale.setScalar(0.15 + 0.6 * smooth(mu / 1.0)); });
  memGlow.position.set(0, 0.55 + Math.sin(mu * 3) * 0.03, 0.75); memGlow.scale.setScalar(memOn ? 0.6 + smooth(mu / 1.5) * 0.6 : 0);
  // hearts in the final scene
  const bu = loc(t, 'bridge'); const cp = s.pos;
  hearts.forEach(h => { const d = h.userData; const k = bu - 3.4 - d.d; h.visible = inS(t, 'bridge') && k > 0;
    h.position.set(cp.x + d.x + Math.sin(k * 2 + d.w) * 0.25, cp.y + 0.8 + k * 0.9, cp.z + d.z); h.scale.setScalar(d.s * smooth(k / 0.4)); h.rotation.y = Math.sin(k * 2 + d.w) * 0.6; });
  rainbow.children.forEach(r => r.material.opacity = 0.75);
}

window.renderFrame = (t) => { update(t); composer.render(); overlay(t); return out.toDataURL('image/jpeg', 0.93); };
window.ready = true;
</script>
