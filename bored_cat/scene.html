// ---------------------------------------------------------------- math
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const backOut = x => { x = clamp(x); const s = 1.9; return 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2; };
function kf(t, keys) {             // keys: [[t, v]] ; v number or array
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1) {
      const k = sm((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], k)) : lerp(v0, v1, k);
    }
  }
  return keys[keys.length - 1][1];
}
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

const matCache = {};
function M(c, opt = {}) {
  const key = c + JSON.stringify(opt);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.82, metalness: 0 }, opt));

}
function box(w, h, d, c, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === "string" ? M(c) : c);

}
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, parent = scene, seg = 32) {

  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;

}
function grp(parent = scene, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function canvasTex(w, h, draw) {

}

    const off = (i * 337) % 512;

});

cyl(0.03, 0.03, 1.4, "#ddd", 2.55, 0.7, -1.2); cyl(0.12, 0.2, 0.22, "#fff2cf", 2.55, 1.45, -1.2);
// picture frames
box(0.5, 0.38, 0.03, "#ffffff", -2.4, 2.0, -2.98); box(0.42, 0.3, 0.035, "#ffd0dc", -2.4, 2.0, -2.98);
// cat tree (pops in during tips)
const tree = grp(scene, -2.25, 0, -2.4);

// treats

for (const p of [[0.35, 0.03, -0.55], [-0.95, 0.63, -2.7], [1.9, 0.03, -0.3]]) {

}

// ---------------------------------------------------------------- cat (pink cube cat)
const CC = { body: "#f7b5ca", head: "#f9c3d4", ear: "#ee86a7", earIn: "#fbc6d6", eye: "#141414", cheek: "#f27ba0", nose: "#ee6c8f", muzzle: "#f6b3a2", spot: "#e48fb0", paw: "#fbd2df" };
function makeCat() {
  const root = grp(scene);
  const pivot = grp(root, 0, 0.07, -0.15);           // rear-up pivot at hind legs
  const inner = grp(pivot, 0, -0.07, 0.15);
  const body = box(0.36, 0.3, 0.4, CC.body, 0, 0.22, 0, inner);
  for (const [x, y, r] of [[-0.08, 0.2, 0.04], [0.06, 0.26, 0.055], [0.11, 0.14, 0.035], [-0.01, 0.11, 0.025]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.007, 6, 24), M(CC.spot)); ring.position.set(x, y, 0.202); inner.add(ring);
  }
  for (const s of [-1, 1]) for (const [z, y, r] of [[0.05, 0.25, 0.05], [-0.1, 0.17, 0.035]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.007, 6, 24), M(CC.spot)); ring.position.set(s * 0.182, y, z); ring.rotation.y = Math.PI / 2; inner.add(ring);
  }
  const legs = [];
  for (const [x, z] of [[-0.11, 0.14], [0.11, 0.14], [-0.11, -0.14], [0.11, -0.14]]) {
    const g = grp(inner, x, 0.1, z);
    box(0.1, 0.1, 0.1, CC.paw, 0, -0.05, 0.005, g);
    legs.push(g);
  }
  const tailBase = grp(inner, 0, 0.2, -0.2);
  const tail = []; let par = tailBase;
  for (let i = 0; i < 5; i++) {
    const g = grp(par, 0, i === 0 ? 0 : 0.075, 0);
    box(0.06, 0.08, 0.06, i === 4 ? CC.ear : CC.body, 0, 0.04, 0, g);
    tail.push(g); par = g;
  }
  const headG = grp(inner, 0, 0.37, 0.05);
  const head = box(0.46, 0.32, 0.36, CC.head, 0, 0.16, 0, headG);
  const face = grp(headG, 0, 0, 0.181);
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = grp(face, s * 0.1, 0.19, 0);
    box(0.105, 0.115, 0.012, CC.eye, 0, 0, 0, e);
    const h1 = box(0.036, 0.036, 0.01, "#ffffff", -0.022, 0.025, 0.008, e);
    const h2 = box(0.022, 0.022, 0.01, "#ffffff", 0.025, -0.03, 0.008, e);
    h1.castShadow = h2.castShadow = false;
    eyes.push({ g: e, hl: [h1, h2] });
  }
  for (const s of [-1, 1]) box(0.06, 0.032, 0.008, CC.cheek, s * 0.165, 0.085, 0, face);
  box(0.05, 0.028, 0.012, CC.nose, 0, 0.105, 0.002, face);
  const muzzle = box(0.13, 0.048, 0.008, CC.muzzle, 0, 0.068, 0, face);
  const mouth = box(0.05, 0.05, 0.01, "#8e2f52", 0, 0.05, 0.004, face); mouth.scale.y = 0.01;
  const ears = [];
  for (const s of [-1, 1]) {
    const eg = grp(headG, s * 0.14, 0.32, 0);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.17, 4), M(CC.ear)); ear.rotation.y = Math.PI / 4; ear.position.y = 0.085; ear.castShadow = true; eg.add(ear);
    const ein = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.11, 4), M(CC.earIn)); ein.rotation.y = Math.PI / 4; ein.position.set(0, 0.06, 0.04); eg.add(ein);
    ears.push(eg);
  }
  return { root, pivot, inner, body, legs, tailBase, tail, headG, eyes, mouth, ears };
}
const cat = makeCat();
function catPose(p) {
  const c = cat, t = p.t || 0;
  c.root.position.set(p.x || 0, p.y || 0, p.z || 0);
  c.root.rotation.set(0, p.ry || 0, 0);
  c.root.scale.setScalar(p.s || 1);
  c.pivot.rotation.x = -(p.rear || 0);
  c.inner.rotation.set(p.tilt || 0, 0, p.roll || 0);
  const breath = 1 + 0.015 * Math.sin(t * 2 * Math.PI / (p.lie ? 3.2 : 2.6));
  c.inner.scale.set(1, (p.lie ? 0.78 : 1) * breath, 1);
  c.inner.position.y = -0.07 + (p.bob || 0) - (p.lie ? 0.07 : 0);
  c.headG.position.set(0, p.lie ? 0.33 : 0.37, p.lie ? 0.1 : 0.05);
  c.headG.rotation.set(p.pitch || 0, p.yaw || 0, p.headRoll || 0);
  for (const l of c.legs) { l.visible = !p.lie; l.rotation.set(0, 0, 0); }
  if (p.walk) {
    const ph = p.walk, a = p.walkAmp || 0.6;
    c.legs[0].rotation.x = Math.sin(ph) * a; c.legs[3].rotation.x = Math.sin(ph) * a;
    c.legs[1].rotation.x = -Math.sin(ph) * a; c.legs[2].rotation.x = -Math.sin(ph) * a;
  }
  if (p.paws) { c.legs[0].rotation.x = p.paws[0]; c.legs[1].rotation.x = p.paws[1]; }
  const wag = p.tailWag === undefined ? 0.25 : p.tailWag, sp = p.tailSpeed || 1.2;
  c.tailBase.rotation.set(p.lie ? -1.5 : -0.5, p.lie ? 0.9 : 0, 0);
  c.tail.forEach((g, i) => { if (i) g.rotation.set(p.lie ? 0 : -0.18, p.lie ? 0.35 : 0, Math.sin(t * sp * 2 * Math.PI - i * 0.7) * wag * (0.5 + i * 0.25)); });
  // eyes
  const mode = p.eyes || "open";
  const blink = mode === "open" && ((t + (p.blinkOff || 0)) % 3.3) < 0.12;
  for (const e of c.eyes) {
    const shut = mode === "closed" || mode === "happy" || blink;
    e.g.scale.y = shut ? 0.14 : mode === "half" ? 0.5 : mode === "big" ? 1.15 : 1;
    e.g.scale.x = mode === "big" ? 1.1 : 1;
    e.g.position.y = mode === "half" ? 0.165 : 0.19;
    e.g.rotation.z = 0;
    e.hl.forEach(h => h.visible = !shut);
  }
  if (mode === "happy") { c.eyes[0].g.rotation.z = 0.35; c.eyes[1].g.rotation.z = -0.35; }
  c.mouth.scale.y = Math.max(0.01, p.mouth || 0);
  const ed = p.earDroop || 0;
  c.ears[0].rotation.z = 0.15 + ed; c.ears[1].rotation.z = -0.15 - ed;
}

    catPose({ t, x: cx, y: cy, z: cz, ry, eyes: t > 27.5 ? "big" : "open", pitch: t > 27.5 ? -0.15 : -0.3, tailWag: 0.4, tailSpeed: 1.5, rear: t > 26.9 && t < 27.35 ? 0.4 : 0, yaw: t > 27.5 ? 0.15 * Math.sin(t * 2.5) : 0 });
    birds.forEach((b, i) => {
      b.visible = true; const bt = t - 26.3 + i * 0.4;
      b.position.set(-1.6 + bt * 0.35 + i * 0.15, 1.75 + 0.1 * Math.sin(bt * 2 + i), -3.5);
      const fl = Math.sin(bt * 18 + i) * 0.6; b.userData.l.rotation.z = fl; b.userData.r.rotation.z = -fl;
    });
    look([kf(t, [[26.3, -0.4], [28.1, -0.6]]), 1.45, kf(t, [[26.3, -0.25], [28.1, -0.55]])], [-1.95, 1.45, -2.5], 60);
    if (t > 26.3 && t < 26.8) SP.sparkle.forEach((s, i) => showSprite(s, -2.25 + (i - 1) * 0.4, 0.6 + i * 0.35, -2.2, backOut((t - 26.3) / 0.25) * 1.5, 1 - (t - 26.3) / 0.5));
  } else {                 // 藏零食
    treats.forEach((x, i) => { x.visible = true; x.rotation.y = t * 1.5 + i; });
    const eat = t > 29.6;
    treats[0].visible = !eat;
    const cx = kf(t, [[28.1, 1.25], [29.2, 0.55]]), cz = kf(t, [[28.1, 0.15], [29.2, -0.45]]);
    const ry = Math.atan2(0.35 - 1.25, -0.55 - 0.15);
    const walking = t < 29.2;
    catPose({ t, x: cx, z: cz, ry, walk: walking ? t * 12 : 0, pitch: walking ? 0.35 + 0.1 * Math.sin(t * 14) : (eat ? 0.05 : 0.5), eyes: eat ? "happy" : "open", mouth: !eat && t > 29.3 ? 0.6 * Math.max(0, Math.sin(t * 20)) : 0, tailWag: 0.5, tailSpeed: 2 });
    SP.sparkle.forEach((s, i) => { const tr = treats[i]; if (tr.visible) showSprite(s, tr.position.x + 0.05, tr.position.y + 0.1, tr.position.z, 0.6 + 0.3 * Math.sin(t * 8 + i * 2), 0.9); });
    if (eat) hearts(t, 29.65, cx - 0.05, 0.75, cz + 0.1, 0.3);
    look([kf(t, [[28.1, -0.75], [31, -0.6]]), kf(t, [[28.1, 1.05], [31, 0.9]]), kf(t, [[28.1, -2.1], [31, -1.95]])], [0.65, 0.3, -0.25], 52, 1);
  }
}
function scene5(t, lt) {   // 回家迎接
  tree.visible = true;
  if (t < 34.6) {
    doorPivot.rotation.y = kf(t, [[31.2, 0], [31.6, -1.35]]);
    const mz = kf(t, [[31.3, -3.5], [32.6, -2.1]]);
    manPose({ visible: true, x: 1.6, z: mz, ry: 0, walk: t < 32.6 ? t * 8 : 0, bag: true, armL: t > 33.0 ? -0.9 : 0, armR: t > 33.0 ? -0.9 : 0, headPitch: t > 32.6 ? 0.35 : 0 });
    // cat: on tree top -> jump down -> run to owner
    let cx = -2.25, cy = 1.335, cz = -2.4, ry = 0.6, walk = 0;
    const jt = clamp((t - 31.7) / 0.45);
    if (t >= 31.7) { cx = lerp(-2.25, -1.4, jt); cz = lerp(-2.4, -1.7, jt); cy = lerp(1.335, 0, jt) + Math.sin(jt * Math.PI) * 0.25; ry = Math.atan2(0.85, 0.7); }
    if (t >= 32.15) {
      const rt = clamp((t - 32.15) / 1.0);
      cx = lerp(-1.4, 1.45, rt); cz = lerp(-1.7, -1.55, rt); cy = Math.abs(Math.sin(rt * Math.PI * 4)) * 0.08; ry = Math.atan2(2.85, 0.15); walk = t * 26;
    }
    let pitch = 0, eyes = t > 31.6 ? "big" : "open", rear = 0;
    if (t >= 33.15) {
      ry = kf(t, [[33.15, Math.atan2(2.85, 0.15)], [33.4, Math.PI - 0.3]]); cx = 1.45; cz = -1.55;
      const jp = Math.max(0, Math.sin((t - 33.3) * Math.PI * 2.2));
      cy = jp * 0.25; rear = 0.6 + jp * 0.4; pitch = -0.4; eyes = "happy";
      hearts(t, 33.3, 1.45, 1.0, -1.5, 0.5);
    }
    catPose({ t, x: cx, y: cy, z: cz, ry, walk, walkAmp: 1.0, eyes, pitch, rear, tailWag: 0.6, tailSpeed: 2.5, paws: rear ? [-1.6, -1.4] : null });
    if (t > 31.5 && t < 32.3) showSprite(SP.ex, -2.25, 1.95, -2.4, backOut((t - 31.5) / 0.25), 1);
    look([kf(t, [[31, -0.6], [34.6, -0.2]]), 1.35, kf(t, [[31, 1.4], [34.6, 1.0]])], [kf(t, [[31, 0.0], [34.6, 1.0]]), 0.8, -2.0], 52);
  } else {                 // 特写: 被摸头的幸福脸
    manPose({ visible: true, x: 1.6, z: -2.1, ry: 0, armR: -1.25 + 0.12 * Math.sin(t * 9), armL: 0, headPitch: 0.5 });
    catPose({ t, x: 1.45, z: -1.55, ry: Math.PI - 0.3, eyes: "happy", pitch: -0.45 + 0.06 * Math.sin(t * 9), tailWag: 0.6, tailSpeed: 2.5, headRoll: 0.08 * Math.sin(t * 4.5) });
    const ry = Math.PI - 0.3, f = [Math.sin(ry), Math.cos(ry)];
    // camera low, behind owner-side, sees cat face looking up
    const d = kf(t, [[34.6, 1.15], [38, 0.85]]);
    look([0.95, kf(t, [[34.6, 1.1], [38, 1.0]]), kf(t, [[34.6, -2.85], [38, -2.65]])], [1.45, 0.5, -1.5], 52, 1);
    hearts(t, 34.7, 1.45, 0.9, -1.45, 0.55);
  }
}

// ---------------------------------------------------------------- overlay (2D)
const ov = document.getElementById("ov"), g = ov.getContext("2d");
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, fill, stroke = null, lw = 0, align = "center") {
  g.font = `bold ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = "middle"; g.lineJoin = "round";
  if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.lineWidth = Math.max(1.5, size * 0.045); g.strokeStyle = fill; g.strokeText(s, x, y); g.fillText(s, x, y);
}
function richLine(s, cx, y, size, alpha) {   // {高亮}
  const parts = []; let hl = false, cur = "";
  for (const ch of s) {
    if (ch === "{" || ch === "}") { if (cur) parts.push([cur, hl]); cur = ""; hl = ch === "{"; } else cur += ch;
  }
  if (cur) parts.push([cur, hl]);
  g.font = `bold ${size}px ${FONT}`;
  const widths = parts.map(p => g.measureText(p[0]).width), tot = widths.reduce((a, b) => a + b, 0);
  let x = cx - tot / 2;
  g.globalAlpha = alpha;
  parts.forEach((p, i) => { txt(p[0], x, y, size, p[1] ? "#ffe14d" : "#ffffff", "#1d1d2b", 13, "left"); x += widths[i]; });
  g.globalAlpha = 1;
}
function subtitleAt(t) {
  for (let i = 0; i < SUBS.length; i++) {
    const st = VO_START[i], dur = VO[i] ? VO[i].dur : 4;
    if (t < st - 0.05 || t > st + dur + 0.35) continue;
    const ch = SUBS[i], w = ch.map((c, j) => c[1] + (j < ch.length - 1 ? 1.2 : 0)), tot = w.reduce((a, b) => a + b, 0);
    let acc = st;
    for (let j = 0; j < ch.length; j++) {
      const e = acc + dur * w[j] / tot;
      if (t < e || j === ch.length - 1) return { text: ch[j][0], t0: acc };
      acc = e;
    }
  }
  return null;
}
function card(x, y, w, h, k) {
  const s = backOut(k);
  g.save(); g.translate(x + w / 2, y + h / 2); g.scale(s, s); g.translate(-x - w / 2, -y - h / 2);
  g.globalAlpha = clamp(k * 3);
  g.shadowColor = "rgba(80,40,80,0.25)"; g.shadowBlur = 30; g.shadowOffsetY = 10;
  rr(x, y, w, h, 36); g.fillStyle = "rgba(255,255,255,0.94)"; g.fill();
  g.shadowColor = "transparent";
  g.lineWidth = 6; g.strokeStyle = "#ff9fbf"; g.stroke();
}
function check(x, y, s, k) {
  rr(x - s / 2, y - s / 2, s, s, 12); g.fillStyle = k > 0 ? "#ff6f9c" : "#ffe3ec"; g.fill();
  if (k > 0) {
    g.strokeStyle = "#fff"; g.lineWidth = 9; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath();
    const p1 = [x - s * 0.25, y], p2 = [x - s * 0.05, y + s * 0.2], p3 = [x + s * 0.28, y - s * 0.22];
    const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1);
    g.moveTo(...p1); g.lineTo(lerp(p1[0], p2[0], k1), lerp(p1[1], p2[1], k1));
    if (k2 > 0) g.lineTo(lerp(p2[0], p3[0], k2), lerp(p2[1], p3[1], k2));
    g.stroke();
  }
}
function drawOverlay(t) {
  g.clearRect(0, 0, W, H);
  // top title
  const tk = clamp((t - 0.15) / 0.5);
  g.save(); g.translate(540, 250); const ts = t < 0.8 ? backOut(tk) : 1; g.scale(ts, ts);
  g.globalAlpha = clamp(tk * 2);
  g.shadowColor = "rgba(120,30,70,0.3)"; g.shadowBlur = 20; g.shadowOffsetY = 8;
  rr(-420, -78, 840, 156, 78); g.fillStyle = "#ff7fa8"; g.fill(); g.shadowColor = "transparent";
  rr(-408, -66, 816, 132, 66); g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,0.8)"; g.stroke();
  txt("你出门，猫会无聊吗？", 0, 2, 70, "#ffffff", "#d9416f", 10);
  g.restore();
  g.globalAlpha = clamp((t - 0.5) / 0.4);
  txt("#猫咪科普  #猫咪知识", 540, 375, 38, "#ffffff", "rgba(60,30,60,0.55)", 8);
  g.globalAlpha = 1;

  // scene cards
  if (t > 7.85 && t < 12.9) {           // 睡眠时长
    const k = clamp((t - 7.85) / 0.4) * (1 - clamp((t - 12.6) / 0.3));
    card(150, 450, 780, 300, k);
    txt("猫咪每天睡", 540, 515, 46, "#7a5a7a");
    const n = Math.round(lerp(0, 16, clamp((t - 8.0) / 1.0)));
    txt(`12~${Math.max(12, n)} 小时`, 540, 595, 84, "#ff5d8f", "#ffffff", 6);
    for (let i = 0; i < 24; i++) {        // 24h bar
      const on = i < 14 && t > 8.2 + i * 0.05;
      rr(185 + i * 29.6, 668, 24, 46, 8); g.fillStyle = on ? "#a9b8ff" : "#f1e6f0"; g.fill();
    }
    g.restore();
  }
  if (t > 13.5 && t < 17.9) {           // 时间流逝
    const k = clamp((t - 13.5) / 0.4) * (1 - clamp((t - 17.6) / 0.3));
    card(230, 450, 620, 210, k);
    const hrs = 8 + 11 * clamp((t - 13.5) / 3.6);
    const hh = Math.floor(hrs), mm = Math.floor((hrs - hh) * 60 / 10) * 10;
    txt("主人不在家", 540, 505, 42, "#7a5a7a");
    txt(`08:00 → ${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`, 540, 590, 66, "#ff7b4f", "#ffffff", 6);
    g.restore();
  }
  if (t > 18.9 && t < 23.95) {          // 无聊表现
    const items = [["乱抓沙发", 19.3], ["半夜跑酷", 20.5], ["狂叫求关注", 21.6]];
    items.forEach(([s, t0], i) => {
      const k = clamp((t - t0) / 0.3) * (1 - clamp((t - 23.65) / 0.3));
      if (k <= 0) return;
      const x = 70, y = 460 + i * 118;
      g.save(); g.translate(x, y + 45); const sc = backOut(k); g.scale(sc, sc); g.translate(-x, -y - 45);
      g.globalAlpha = clamp(k * 3);
      rr(x, y, 400, 90, 45); g.fillStyle = "rgba(255,255,255,0.93)"; g.fill(); g.lineWidth = 5; g.strokeStyle = "#ff6b6b"; g.stroke();
      g.beginPath(); g.arc(x + 48, y + 45, 28, 0, Math.PI * 2); g.fillStyle = "#ff6b6b"; g.fill();
      g.strokeStyle = "#fff"; g.lineWidth = 7; g.lineCap = "round"; g.beginPath();
      g.moveTo(x + 36, y + 33); g.lineTo(x + 60, y + 57); g.moveTo(x + 60, y + 33); g.lineTo(x + 36, y + 57); g.stroke();
      txt(s, x + 92, y + 46, 46, "#d64545", null, 0, "left");
      g.restore();
    });
  }
  if (t > 24.2 && t < 30.95) {          // 小妙招清单
    const k = clamp((t - 24.2) / 0.4) * (1 - clamp((t - 30.65) / 0.3));
    card(450, 430, 600, 290, k);
    txt("出门前 3 个小妙招", 750, 478, 40, "#ff5d8f");
    const rows = [["陪玩 10 分钟，耗掉精力", 24.3], ["猫爬架放窗边，看鸟解闷", 26.3], ["藏几颗零食，玩寻宝", 28.1]];
    rows.forEach(([s, t0], i) => {
      const y = 548 + i * 60, kk = clamp((t - t0) / 0.5);
      g.globalAlpha = clamp(k * 3) * (0.35 + 0.65 * clamp((t - t0 + 0.2) / 0.3));
      check(500, y, 40, kk);
      txt(s, 535, y + 2, 31, "#5c4560", null, 0, "left");
    });
    g.globalAlpha = 1;
    g.restore();
  }
  // subtitles
  const sub = subtitleAt(t);
  if (sub) {
    const a = clamp((t - sub.t0) / 0.12);
    richLine(sub.text, 540, 1470 + (1 - a) * 12, 70, a);
  }
  // end card
  if (t > 35.6) {
    const k = clamp((t - 35.6) / 0.5);
    g.globalAlpha = k * 0.55; g.fillStyle = "#3a2540"; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
    g.save(); g.translate(540, 960); const s = backOut(k); g.scale(s, s);
    g.globalAlpha = clamp(k * 2);
    rr(-400, -190, 800, 380, 48); g.fillStyle = "#ffffff"; g.fill(); g.lineWidth = 8; g.strokeStyle = "#ff7fa8"; g.stroke();
    txt("猫咪不怕你出门", 0, -95, 64, "#ff5d8f");
    txt("怕的是你回家也不陪它", 0, -10, 50, "#7a5a7a");
    rr(-200, 55, 400, 96, 48); g.fillStyle = "#ff7fa8"; g.fill();
    txt("关注我 · 学养猫", 0, 104, 48, "#ffffff");
    g.restore();
  }
  // scene transition dips
  for (const b of SCN.slice(1, -1)) {
    const d = Math.abs(t - b);
    if (d < 0.14) { g.globalAlpha = 1 - d / 0.14; g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  }
  if (t < 0.25) { g.globalAlpha = 1 - t / 0.25; g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  if (t > 37.6) { g.globalAlpha = (t - 37.6) / 0.4; g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
}

// ---------------------------------------------------------------- entry
window.renderAt = function (t) {
  resetWorld(t);
  if (t < SCN[1]) scene0(t);
  else if (t < SCN[2]) scene1(t, t - SCN[1]);
  else if (t < SCN[3]) scene2(t, t - SCN[2]);
  else if (t < SCN[4]) scene3(t, t - SCN[3]);
  else if (t < SCN[5]) scene4(t, t - SCN[4]);
  else scene5(t, t - SCN[5]);
  renderer.render(scene, camera);
  drawOverlay(t);
  return true;
};
window.READY = true;
